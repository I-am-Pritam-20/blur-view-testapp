name: Release Build (APK + AAB)

# ── Manual trigger ONLY — never runs automatically ────────────────────────────
# Triggered by: rnx release 1.0.0
# Always builds from 'main' branch (rnx release merges dev→main first)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      version_code:
        description: 'Version code (integer, auto-set by rnx release)'
        required: true

jobs:
  build-release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout main ─────────────────────────────────────────────────────
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # ── 2. Setup Java 17 ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Setup Node 20 ─────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Decode keystore from GitHub Secret ────────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/release.keystore
          echo "✅ Keystore decoded"

      # ── 6. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 7. Inject version ────────────────────────────────────────────────────
      - name: Inject version into build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle

      # ── 8. Build signed Release APK ──────────────────────────────────────────
      - name: Build Release APK
        env:
          KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --warning-mode=none \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # ── 9. Build AAB (for future Play Store use — NOT published now) ──────────
      - name: Build Release AAB
        env:
          KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            --no-daemon \
            --warning-mode=none \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # ── 10. Rename artifacts ─────────────────────────────────────────────────
      - name: Rename release artifacts
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          BUILD="${{ github.event.inputs.version_code }}"
          DATE=$(date +'%Y%m%d')
          APK_NAME="release-v${VERSION}-build${BUILD}-${DATE}.apk"
          AAB_NAME="release-v${VERSION}-build${BUILD}-${DATE}.aab"
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/${APK_NAME}
          mv android/app/build/outputs/bundle/release/app-release.aab \
             android/app/build/outputs/bundle/release/${AAB_NAME}
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "AAB_NAME=${AAB_NAME}" >> $GITHUB_ENV

      # ── 11. Create PERMANENT GitHub Release ──────────────────────────────────
      # Every version is stored forever — v1, v50, v100 all downloadable always.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Release v${{ github.event.inputs.version_name }}
          body: |
            ## Release v${{ github.event.inputs.version_name }}

            **Build code:** ${{ github.event.inputs.version_code }}
            **Branch:** `main` — commit `${{ github.sha }}`

            ### Downloads
            - **APK** — install directly on any Android device
            - **AAB** — Android App Bundle (stored for future Play Store publishing)

            > All previous releases are permanently available in the [Releases tab](../../releases).
          files: |
            android/app/build/outputs/apk/release/${{ env.APK_NAME }}
            android/app/build/outputs/bundle/release/${{ env.AAB_NAME }}
          draft: false
          prerelease: false
          make_latest: true

      # ── 12. CLEAN EVERYTHING ─────────────────────────────────────────────────
      - name: Clean all caches and sensitive files
        if: always()
        run: |
          cd android && ./gradlew clean --no-daemon 2>/dev/null || true
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf android/app/bundle
          rm -f  android/app/release.keystore
          rm -rf node_modules
          echo "✅ All Gradle caches, build outputs, node_modules, and keystore removed."

      # ── 13. Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: success()
        run: |
          echo "### 🚀 Release v${{ github.event.inputs.version_name }} Published" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **AAB** | \`${{ env.AAB_NAME }}\` (stored, not on Play Store) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ github.event.inputs.version_name }}\` (build \`${{ github.event.inputs.version_code }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Release** | Permanent ✅ |" >> $GITHUB_STEP_SUMMARY